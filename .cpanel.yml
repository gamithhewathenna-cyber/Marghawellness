---
# MĀRGHĀ Wellness — cPanel Git™ Version Control deployment
# ---------------------------------------------------------------
# Runs ONLY when you click "Deploy HEAD Commit" in cPanel › Git™ Version Control.
# It copies the website code into public_html and nothing else:
#   • never touches the database (no SQL is imported or run)
#   • never deletes files on the server (no --delete) — admin uploads in
#     assets/images/uploads/ and the secrets file outside public_html are untouched
#   • skips everything listed in .deployignore (Git data, SQL files, docs …)
#
# BEFORE THE FIRST DEPLOY: check DEPLOYPATH below matches your website folder,
# and create /home/margkihr/margha-secrets.php (see config/secrets.example.php).
deployment:
  tasks:
    - export DEPLOYPATH=/home/margkihr/public_html/
    - /usr/bin/rsync -rlt --chmod=D755,F644 --exclude-from=.deployignore ./ "$DEPLOYPATH"
