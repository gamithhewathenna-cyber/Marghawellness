; MĀRGHĀ Wellness — PHP settings for cPanel (PHP-FPM / CGI read this file)
; Never show error details to visitors; record them in the error log instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off

; Safer sessions
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
